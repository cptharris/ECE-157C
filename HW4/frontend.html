<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECE 272C: Analytics Agent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>

    <style>
        /* ── Dracula palette ──────────────────────────────────────────────────── */
        :root {
            --bg: #0a0b16;
            --surface: #282a36;
            --elevated: #313444;
            --border: #44475a;
            --comment: #a2b2e4;
            --fg: #f8f8f2;
            --cyan: #8be9fd;
            --green: #50fa7b;
            --orange: #ffb86c;
            --pink: #ff79c6;
            --purple: #bd93f9;
            --red: #ff5555;
            --yellow: #f1fa8c;

            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --font-ui: 'Syne', sans-serif;

            --sidebar-w: 260px;
            --radius: 6px;
        }

        /* ── Reset ─────────────────────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-mono);
            background: var(--bg);
            color: var(--fg);
            display: flex;
        }

        /* ── Scrollbar ──────────────────────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--comment);
        }

        /* ── Sidebar ────────────────────────────────────────────────────────────── */
        #sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #logo {
            padding: 20px 18px 16px;
            border-bottom: 1px solid var(--border);
        }

        #logo .logo-mark {
            font-family: var(--font-ui);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #logo .logo-mark .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--purple);
            flex-shrink: 0;
        }

        #logo .logo-sub {
            font-size: 10px;
            color: var(--comment);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 5px;
            padding-left: 17px;
        }

        #file-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 14px;
            gap: 10px;
        }

        #file-panel h3 {
            font-family: var(--font-ui);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--comment);
        }

        #file-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 9px;
            border-radius: var(--radius);
            background: var(--elevated);
            border: 1px solid transparent;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            user-select: none;
        }

        .file-item:hover {
            border-color: var(--border);
        }

        .file-item.selected {
            border-color: var(--purple);
            background: rgba(189, 147, 249, 0.1);
        }

        .file-item .fi-check {
            width: 13px;
            height: 13px;
            border-radius: 3px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-item.selected .fi-check {
            background: var(--purple);
            border-color: var(--purple);
        }

        .file-item.selected .fi-check::after {
            content: '✓';
            font-size: 8px;
            color: var(--bg);
            font-weight: 700;
        }

        .file-item .fi-name {
            font-size: 11px;
            color: var(--fg);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .no-files {
            font-size: 11px;
            color: var(--comment);
            text-align: center;
            padding: 14px 0;
        }

        /* ── Main ───────────────────────────────────────────────────────────────── */
        #main {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Output ─────────────────────────────────────────────────────────────── */
        #output-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0.35;
        }

        #empty-state .es-glyph {
            font-size: 36px;
            line-height: 1;
        }

        #empty-state p {
            font-size: 12px;
            color: var(--comment);
            text-align: center;
            max-width: 280px;
            line-height: 1.6;
        }

        /* ── Chat turns ─────────────────────────────────────────────────────────── */
        .chat-turn {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-bubble.user {
            align-self: flex-end;
            max-width: 70%;
            background: rgba(189, 147, 249, 0.12);
            border: 1px solid rgba(189, 147, 249, 0.35);
            border-radius: 14px 14px 3px 14px;
            padding: 9px 14px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--fg);
            white-space: pre-wrap;
            word-break: break-word;
            animation: slide-in 0.2s ease;
        }

        .chat-bubble.agent {
            align-self: flex-start;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Node log (inline activity feed) ────────────────────────────────────── */
        .node-log {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 8px 12px;
            background: rgba(40, 42, 54, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            animation: slide-in 0.2s ease;
        }

        .node-log:empty {
            display: none;
        }

        .nl-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 3px 0;
            font-size: 11px;
            transition: opacity 0.4s;
        }

        .nl-item.done {
            opacity: 0.38;
        }

        .nl-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 1px;
            position: relative;
            top: 1px;
        }

        .nl-dot.running {
            background: var(--cyan);
            animation: pulse-dot 1.2s ease-in-out infinite;
        }

        .nl-dot.done {
            background: var(--green);
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 4px var(--cyan);
            }

            50% {
                opacity: 0.4;
                box-shadow: none;
            }
        }

        .nl-node {
            font-weight: 600;
            color: var(--cyan);
            letter-spacing: 0.04em;
            min-width: 110px;
        }

        .nl-item.done .nl-node {
            color: var(--comment);
            font-weight: 400;
        }

        .nl-desc {
            color: var(--comment);
            flex: 1;
        }

        .nl-item.done .nl-desc {
            color: transparent;
            font-size: 0;
        }

        /* collapse desc when done */

        /* ── Output blocks ───────────────────────────────────────────────────────── */
        .out-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            animation: slide-in 0.22s ease;
            overflow: hidden;
        }

        .out-block .block-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            background: var(--elevated);
            border-bottom: 1px solid var(--border);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--comment);
            cursor: pointer;
            user-select: none;
        }

        .out-block .block-header .bh-label {
            flex: 1;
        }

        .out-block .block-header .bh-toggle {
            font-size: 9px;
            transition: transform 0.2s;
        }

        .out-block.collapsed .bh-toggle {
            transform: rotate(-90deg);
        }

        .out-block.collapsed .block-body {
            display: none;
        }

        .bh-tag {
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 600;
        }

        .tag-step {
            background: rgba(139, 233, 253, 0.15);
            color: var(--cyan);
        }

        .tag-result {
            background: rgba(80, 250, 123, 0.15);
            color: var(--green);
        }

        .tag-plot {
            background: rgba(255, 184, 108, 0.15);
            color: var(--orange);
        }

        .tag-valid {
            background: rgba(189, 147, 249, 0.15);
            color: var(--purple);
        }

        .tag-answer {
            background: rgba(80, 250, 123, 0.15);
            color: var(--green);
        }

        .tag-error {
            background: rgba(255, 85, 85, 0.15);
            color: var(--red);
        }

        .tag-generic {
            background: rgba(241, 250, 140, 0.15);
            color: var(--yellow);
        }

        .block-body {
            padding: 12px 14px;
        }

        /* ── Code and output — scrollable, height-capped ────────────────────────── */
        .code-block {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 13px;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre;
            color: var(--fg);
            max-height: 40vh;
            overflow: auto;
            margin-bottom: 8px;
        }

        .code-block:last-child {
            margin-bottom: 0;
        }

        .block-label {
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--comment);
            margin-bottom: 5px;
        }

        .reasoning-text {
            font-size: 12px;
            line-height: 1.7;
            color: var(--orange);
            margin-bottom: 8px;
            padding: 9px 12px;
            border-left: 2px solid rgba(255, 184, 108, 0.6);
            background: rgba(255, 184, 108, 0.05);
            border-radius: 0 4px 4px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .stdout-block {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 9px 13px;
            font-size: 11.5px;
            line-height: 1.6;
            color: var(--green);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 40vh;
            overflow-y: auto;
        }

        .stdout-empty {
            color: var(--comment);
            font-style: italic;
        }

        .error-text {
            color: var(--red);
        }

        /* ── Streaming tokens ───────────────────────────────────────────────────── */
        #streaming-tokens {
            font-size: 13px;
            line-height: 1.8;
            color: var(--fg);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--purple);
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
            margin-left: 1px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* ── Validation block ───────────────────────────────────────────────────── */
        .verdict-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .verdict-approved {
            background: rgba(80, 250, 123, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .verdict-retry {
            background: rgba(255, 85, 85, 0.15);
            color: var(--red);
            border: 1px solid var(--red);
        }

        .verdict-needs_more_analysis {
            background: rgba(255, 184, 108, 0.15);
            color: var(--orange);
            border: 1px solid var(--orange);
        }

        .verdict-inconsistent_results {
            background: rgba(255, 85, 85, 0.15);
            color: var(--red);
            border: 1px solid var(--red);
        }

        .verdict-missing_analysis {
            background: rgba(241, 250, 140, 0.15);
            color: var(--yellow);
            border: 1px solid var(--yellow);
        }

        .verdict-text {
            font-size: 12px;
            line-height: 1.7;
            color: var(--fg);
            white-space: pre-wrap;
            max-height: 40vh;
            overflow-y: auto;
        }

        /* ── Plot container ─────────────────────────────────────────────────────── */
        .plot-container {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
        }

        /* ── Final answer ───────────────────────────────────────────────────────── */
        .final-answer-text {
            font-size: 13px;
            line-height: 1.8;
            color: var(--fg);
        }

        .final-answer-text h1,
        .final-answer-text h2,
        .final-answer-text h3,
        .final-answer-text h4 {
            font-family: var(--font-ui);
            font-weight: 700;
            color: var(--purple);
            margin: 1em 0 0.35em;
            line-height: 1.3;
        }

        .final-answer-text h1 {
            font-size: 17px;
        }

        .final-answer-text h2 {
            font-size: 14px;
        }

        .final-answer-text h3 {
            font-size: 13px;
            color: var(--cyan);
        }

        .final-answer-text p {
            margin: 0 0 0.7em;
        }

        .final-answer-text p:last-child {
            margin-bottom: 0;
        }

        .final-answer-text strong {
            color: var(--yellow);
            font-weight: 600;
        }

        .final-answer-text em {
            color: var(--orange);
            font-style: italic;
        }

        .final-answer-text a {
            color: var(--cyan);
            text-underline-offset: 3px;
        }

        .final-answer-text a:hover {
            color: var(--pink);
        }

        .final-answer-text ul,
        .final-answer-text ol {
            padding-left: 1.3em;
            margin: 0 0 0.7em;
        }

        .final-answer-text li {
            margin-bottom: 0.25em;
        }

        .final-answer-text code {
            font-family: var(--font-mono);
            font-size: 11.5px;
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
            color: var(--green);
        }

        .final-answer-text pre {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 13px;
            overflow-x: auto;
            margin: 0 0 0.7em;
            max-height: 40vh;
        }

        .final-answer-text pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 12px;
            color: var(--fg);
        }

        .final-answer-text blockquote {
            border-left: 2px solid var(--purple);
            margin: 0 0 0.7em;
            padding: 3px 12px;
            color: var(--comment);
            background: rgba(189, 147, 249, 0.05);
            border-radius: 0 4px 4px 0;
        }

        .final-answer-text table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-bottom: 0.7em;
        }

        .final-answer-text th,
        .final-answer-text td {
            padding: 5px 10px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .final-answer-text th {
            background: var(--elevated);
            color: var(--cyan);
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .final-answer-text tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.02);
        }

        .final-answer-text hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 0.9em 0;
        }

        /* ── Question area ──────────────────────────────────────────────────────── */
        #question-area {
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: rgba(40, 42, 54, 0.6);
        }

        #question {
            flex: 1;
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 8px 12px;
            resize: none;
            min-height: 36px;
            max-height: 120px;
            line-height: 1.5;
            transition: border-color 0.2s;
            outline: none;
        }

        #question::placeholder {
            color: var(--comment);
        }

        #question:focus {
            border-color: var(--purple);
        }

        #run-btn {
            background: var(--purple);
            color: var(--bg);
            border: none;
            border-radius: var(--radius);
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 12px;
            padding: 8px 18px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, transform 0.1s;
            letter-spacing: 0.04em;
        }

        #run-btn:hover {
            background: var(--pink);
        }

        #run-btn:active {
            transform: scale(0.97);
        }

        #run-btn:disabled {
            background: var(--comment);
            cursor: not-allowed;
            transform: none;
        }

        #clear-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--comment);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 8px 11px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        #clear-btn:hover {
            color: var(--red);
            border-color: var(--red);
        }

        .mt-6 {
            margin-top: 6px;
        }
    </style>
</head>

<body>

    <!-- ═══════════════════════════════ SIDEBAR ══════════════════════════════ -->
    <aside id="sidebar">
        <div id="logo">
            <div class="logo-mark">
                <span class="dot"></span>
                analytics agent
            </div>
            <div class="logo-sub">LangGraph · Plotly · AI</div>
        </div>

        <div id="file-panel">
            <h3>Datasets</h3>
            <div id="file-list">
                <div class="no-files" id="no-files-msg">No CSV files found in datasets/.</div>
            </div>
        </div>
    </aside>

    <!-- ═══════════════════════════════ MAIN ═════════════════════════════════ -->
    <main id="main">

        <div id="output-area">
            <div id="empty-state">
                <div class="es-glyph">◈</div>
                <p>Select one or more datasets from the sidebar, then ask a question.</p>
            </div>
        </div>

        <div id="question-area">
            <textarea id="question" placeholder="Ask a question… (Enter to send, Shift+Enter for newline)"
                rows="1"></textarea>
            <button id="clear-btn" title="Clear output">✕</button>
            <button id="run-btn">Run ▶</button>
        </div>

    </main>

    <script>
        /* ═══════════════════════════════════════════════════════════════════════
           CONSTANTS
        ═══════════════════════════════════════════════════════════════════════ */
        const NODE_LABELS = {
            orchestrate: 'orchestrate',
            dataset_fan: 'dataset·fan',
            analytics: 'analytics',
            analytics_init: 'analytics·init',
            analytics_step: 'analytics·step',
            analytics_answer: 'analytics·answer',
            plan: 'plan·plan',
            plan_execute: 'plan·execute',
            plan_respond: 'plan·respond',
            validate: 'validate',
            retry: 'retry',
            generic: 'generic',
            generic_search: 'generic·search',
            generic_respond: 'generic·respond',
            finalize: 'finalize',
        };

        const NODE_DESCS = {
            orchestrate: 'Routing the question…',
            dataset_fan: 'Reading and profiling datasets…',
            analytics: 'Crunching the data…',
            analytics_init: 'Setting up the analysis workspace…',
            analytics_step: 'Running an analysis step…',
            analytics_answer: 'Synthesizing findings…',
            plan: 'Building an independent validation plan…',
            plan_execute: 'Executing validation steps…',
            plan_respond: 'Summarizing validation results…',
            validate: 'Cross-checking both analysis paths…',
            retry: 'Retrying with validator feedback…',
            generic: 'Handling a non-dataset question…',
            generic_search: 'Searching for relevant sources…',
            generic_respond: 'Drafting response from sources…',
            finalize: 'Preparing final answer and plots…',
        };

        /* ═══════════════════════════════════════════════════════════════════════
           STATE
        ═══════════════════════════════════════════════════════════════════════ */
        const state = {
            files: [],
            selected: new Set(),
            running: false,
            currentTurnId: null,
        };

        let currentAgentContainer = null;
        let currentNodeLog = null;
        let tokenTarget = null;
        let stepBlocks = {};
        let plotlyCounter = 0;

        /* ═══════════════════════════════════════════════════════════════════════
           ELEMENTS
        ═══════════════════════════════════════════════════════════════════════ */
        const $ = id => document.getElementById(id);
        const fileList = $('file-list');
        const noFilesMsg = $('no-files-msg');
        const questionEl = $('question');
        const runBtn = $('run-btn');
        const clearBtn = $('clear-btn');
        const outputArea = $('output-area');
        const emptyState = $('empty-state');

        /* ═══════════════════════════════════════════════════════════════════════
           FILE MANAGEMENT
        ═══════════════════════════════════════════════════════════════════════ */
        async function fetchFiles() {
            try {
                const r = await fetch('/api/files');
                const d = await r.json();
                state.files = d.files || [];
                renderFileList();
            } catch (e) { console.error('fetchFiles:', e); }
        }

        function renderFileList() {
            fileList.innerHTML = '';
            if (state.files.length === 0) {
                fileList.appendChild(noFilesMsg);
                noFilesMsg.style.display = '';
                return;
            }
            noFilesMsg.style.display = 'none';
            state.files.forEach(name => {
                const item = document.createElement('div');
                item.className = 'file-item' + (state.selected.has(name) ? ' selected' : '');
                item.dataset.name = name;
                const check = document.createElement('div');
                check.className = 'fi-check';
                const label = document.createElement('span');
                label.className = 'fi-name';
                label.textContent = name;
                label.title = name;
                item.appendChild(check);
                item.appendChild(label);
                item.addEventListener('click', () => toggleSelect(name));
                fileList.appendChild(item);
            });
        }

        function toggleSelect(name) {
            state.selected.has(name) ? state.selected.delete(name) : state.selected.add(name);
            renderFileList();
        }

        /* ═══════════════════════════════════════════════════════════════════════
           NODE LOG (inline activity feed per turn)
        ═══════════════════════════════════════════════════════════════════════ */
        function onNodeStart(node) {
            if (!currentNodeLog) return;
            const item = document.createElement('div');
            item.className = 'nl-item';
            item.id = `nli-${state.currentTurnId}-${node}`;

            const dot = document.createElement('span');
            dot.className = 'nl-dot running';

            const nameEl = document.createElement('span');
            nameEl.className = 'nl-node';
            nameEl.textContent = NODE_LABELS[node] || node;

            const descEl = document.createElement('span');
            descEl.className = 'nl-desc';
            descEl.textContent = NODE_DESCS[node] || '';

            item.appendChild(dot);
            item.appendChild(nameEl);
            item.appendChild(descEl);
            currentNodeLog.appendChild(item);
            scrollBottom();
        }

        function onNodeEnd(node) {
            const item = $(`nli-${state.currentTurnId}-${node}`);
            if (!item) return;
            item.querySelector('.nl-dot').className = 'nl-dot done';
            item.classList.add('done');
        }

        /* ═══════════════════════════════════════════════════════════════════════
           OUTPUT RENDERING
        ═══════════════════════════════════════════════════════════════════════ */
        function scrollBottom() {
            outputArea.scrollTop = outputArea.scrollHeight;
        }

        function clearOutput() {
            outputArea.querySelectorAll('.chat-turn').forEach(el => el.remove());
            stepBlocks = {};
            tokenTarget = null;
            plotlyCounter = 0;
            currentAgentContainer = null;
            currentNodeLog = null;
        }

        function hideEmpty() {
            emptyState.style.display = 'none';
        }

        function renderUserBubble(question) {
            const turnId = `t${Date.now()}`;
            state.currentTurnId = turnId;

            const turn = document.createElement('div');
            turn.className = 'chat-turn';
            turn.id = turnId;

            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble user';
            bubble.textContent = question;
            turn.appendChild(bubble);

            const agent = document.createElement('div');
            agent.className = 'chat-bubble agent';
            turn.appendChild(agent);

            /* node log lives at the top of the agent area */
            const nodeLog = document.createElement('div');
            nodeLog.className = 'node-log';
            nodeLog.id = `nl-${turnId}`;
            agent.appendChild(nodeLog);

            outputArea.appendChild(turn);
            currentAgentContainer = agent;
            currentNodeLog = nodeLog;
            scrollBottom();
        }

        /* Helpers ─────────────────────────────────────────────────────────── */
        function makeBlock(id, headerLabel, tag, tagClass, collapsible = true) {
            const block = document.createElement('div');
            block.className = 'out-block';
            if (id) block.id = id;

            const header = document.createElement('div');
            header.className = 'block-header';

            const label = document.createElement('span');
            label.className = 'bh-label';
            label.textContent = headerLabel;

            const tagEl = document.createElement('span');
            tagEl.className = `bh-tag ${tagClass}`;
            tagEl.textContent = tag;

            const toggle = document.createElement('span');
            toggle.className = 'bh-toggle';
            toggle.textContent = '▾';

            header.appendChild(label);
            header.appendChild(tagEl);
            if (collapsible) {
                header.appendChild(toggle);
                header.addEventListener('click', () => block.classList.toggle('collapsed'));
            }

            const body = document.createElement('div');
            body.className = 'block-body';

            block.appendChild(header);
            block.appendChild(body);

            const target = currentAgentContainer || outputArea;
            target.appendChild(block);
            scrollBottom();
            return { block, body };
        }

        function makeLabel(text) {
            const el = document.createElement('div');
            el.className = 'block-label';
            el.textContent = text;
            return el;
        }

        /* Step ─────────────────────────────────────────────────────────────── */
        function renderStep(ev) {
            const idx = ev.index;
            const key = `step-${idx}`;
            if (stepBlocks[key]) return;

            const { block, body } = makeBlock(null, `Step ${idx}`, 'step', 'tag-step');
            stepBlocks[key] = body;

            if (ev.reasoning) {
                body.appendChild(makeLabel('Reasoning'));
                const rt = document.createElement('div');
                rt.className = 'reasoning-text';
                rt.textContent = ev.reasoning;
                body.appendChild(rt);
            }

            if (ev.code) {
                body.appendChild(makeLabel('Code'));
                const cb = document.createElement('pre');
                cb.className = 'code-block';
                cb.textContent = ev.code;
                body.appendChild(cb);
            }
        }

        function renderStepResult(ev) {
            const body = stepBlocks[`step-${ev.index}`];
            if (!body) return;

            const hasError = !!ev.error;
            const lbl = makeLabel(hasError ? 'Error' : 'Output');
            lbl.classList.add('mt-6');

            const sb = document.createElement('pre');
            sb.className = 'stdout-block' + (hasError ? ' error-text' : '');
            if (!ev.stdout && !hasError) sb.classList.add('stdout-empty');
            sb.textContent = hasError ? ev.error : (ev.stdout || '(no output)');

            body.appendChild(lbl);
            body.appendChild(sb);
            scrollBottom();
        }

        /* Plot ─────────────────────────────────────────────────────────────── */
        function renderPlot(ev) {
            const ctr = ++plotlyCounter;
            const { body } = makeBlock(null, ev.title || `Plot ${ctr}`, 'plot', 'tag-plot', false);

            const plotDiv = document.createElement('div');
            plotDiv.className = 'plot-container';
            plotDiv.id = `${state.currentTurnId}-plotly-${ctr}`;
            body.appendChild(plotDiv);

            const fig = ev.figure_json || {};
            const layout = Object.assign({
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { family: "'JetBrains Mono', monospace", color: '#f8f8f2', size: 11 },
                xaxis: { gridcolor: '#44475a', linecolor: '#44475a', zerolinecolor: '#44475a' },
                yaxis: { gridcolor: '#44475a', linecolor: '#44475a', zerolinecolor: '#44475a' },
                margin: { t: 36, r: 16, b: 52, l: 52 },
                legend: { bgcolor: 'rgba(0,0,0,0)', font: { color: '#f8f8f2' } },
            }, fig.layout || {});

            const draculaColors = ['#bd93f9', '#8be9fd', '#50fa7b', '#ffb86c', '#ff79c6', '#ff5555', '#f1fa8c'];
            const data = (fig.data || []).map((trace, i) => {
                const t = { ...trace };
                if (!t.marker) t.marker = {};
                if (!t.marker.color) t.marker.color = draculaColors[i % draculaColors.length];
                if (!t.line) t.line = {};
                if (!t.line.color) t.line.color = draculaColors[i % draculaColors.length];
                return t;
            });

            Plotly.newPlot(plotDiv.id, data, layout, {
                responsive: true, displayModeBar: true,
                modeBarButtonsToRemove: ['toImage'], displaylogo: false,
            });
        }

        /* Validation ───────────────────────────────────────────────────────── */
        function renderValidation(ev) {
            const { body } = makeBlock(null, 'Validation', 'validate', 'tag-valid');

            const badge = document.createElement('span');
            badge.className = `verdict-badge verdict-${ev.verdict}`;
            badge.textContent = ev.verdict.replace(/_/g, ' ');

            const text = document.createElement('pre');
            text.className = 'verdict-text';
            text.textContent = ev.reasoning || '';

            body.appendChild(badge);
            body.appendChild(text);
        }

        /* Final answer ─────────────────────────────────────────────────────── */
        function renderFinalAnswer(ev) {
            finaliseTokenBlock();
            const { body } = makeBlock('answer-block', 'Answer', 'answer', 'tag-answer', false);
            const text = document.createElement('div');
            text.className = 'final-answer-text';
            text.innerHTML = marked.parse(ev.answer, { breaks: true, gfm: true });
            body.appendChild(text);
        }

        /* Streaming tokens ─────────────────────────────────────────────────── */
        function ensureTokenBlock() {
            if (tokenTarget) return;
            const { block, body } = makeBlock(null, 'Generating…', 'answer', 'tag-generic', false);
            const span = document.createElement('span');
            span.id = 'streaming-tokens';
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            body.appendChild(span);
            body.appendChild(cursor);
            tokenTarget = span;
            block._cursor = cursor;
            tokenTarget._block = block;
        }

        function appendToken(text) {
            ensureTokenBlock();
            tokenTarget.textContent += text;
            scrollBottom();
        }

        function finaliseTokenBlock() {
            if (!tokenTarget) return;
            const block = tokenTarget._block;
            if (block) {
                const lbl = block.querySelector('.bh-label');
                if (lbl) lbl.textContent = 'Response';
                if (block._cursor) block._cursor.remove();
            }
            tokenTarget = null;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           EVENT HANDLER
        ═══════════════════════════════════════════════════════════════════════ */
        function handleEvent(ev) {
            console.log(ev);
            switch (ev.type) {
                case 'node_start':
                    onNodeStart(ev.node);
                    break;

                case 'node_end':
                    onNodeEnd(ev.node);
                    break;

                case 'token':
                    appendToken(ev.text);
                    break;

                case 'step':
                    finaliseTokenBlock();
                    renderStep(ev);
                    break;

                case 'step_result':
                    renderStepResult(ev);
                    break;

                case 'plot':
                    renderPlot(ev);
                    break;

                case 'validation':
                    renderValidation(ev);
                    break;

                case 'final_answer':
                    renderFinalAnswer(ev);
                    break;

                case 'done':
                    break;

                case 'error': {
                    finaliseTokenBlock();
                    const { body } = makeBlock(null, 'Error', 'error', 'tag-error', false);
                    const msg = document.createElement('pre');
                    msg.className = 'stdout-block error-text';
                    msg.textContent = ev.message + (ev.traceback ? '\n\n' + ev.traceback : '');
                    body.appendChild(msg);
                    break;
                }
            }
        }

        /* ═══════════════════════════════════════════════════════════════════════
           AGENT RUN
        ═══════════════════════════════════════════════════════════════════════ */
        async function runAgent() {
            if (state.running) return;

            const question = questionEl.value.trim();
            if (!question) { questionEl.focus(); return; }
            const selectedFiles = [...state.selected];

            questionEl.value = '';
            questionEl.style.height = 'auto';
            hideEmpty();
            renderUserBubble(question);

            state.running = true;
            runBtn.disabled = true;
            runBtn.textContent = 'Running…';
            stepBlocks = {};
            tokenTarget = null;
            plotlyCounter = 0;

            try {
                const resp = await fetch('/api/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, csv_files: selectedFiles }),
                });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({ detail: resp.statusText }));
                    throw new Error(err.detail || resp.statusText);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();

                    for (const part of parts) {
                        const line = part.trim();
                        if (!line.startsWith('data: ')) continue;
                        let ev;
                        try { ev = JSON.parse(line.slice(6)); } catch { continue; }
                        handleEvent(ev);
                    }
                }

            } catch (err) {
                const { body } = makeBlock(null, 'Error', 'error', 'tag-error', false);
                const msg = document.createElement('pre');
                msg.className = 'stdout-block error-text';
                msg.textContent = err.message;
                body.appendChild(msg);
            } finally {
                $(`nl-${state.currentTurnId}`).remove();
                finaliseTokenBlock();
                state.running = false;
                runBtn.disabled = false;
                runBtn.textContent = 'Run ▶';
                scrollBottom();
                questionEl.focus();
            }
        }

        /* ═══════════════════════════════════════════════════════════════════════
           CONTROLS
        ═══════════════════════════════════════════════════════════════════════ */
        runBtn.addEventListener('click', runAgent);

        questionEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                runAgent();
            }
        });

        questionEl.addEventListener('input', () => {
            questionEl.style.height = 'auto';
            questionEl.style.height = Math.min(questionEl.scrollHeight, 120) + 'px';
        });

        clearBtn.addEventListener('click', () => {
            clearOutput();
            emptyState.style.display = '';
            stepBlocks = {};
            tokenTarget = null;
            plotlyCounter = 0;
        });

        /* ═══════════════════════════════════════════════════════════════════════
           INIT
        ═══════════════════════════════════════════════════════════════════════ */
        fetchFiles();
    </script>
</body>
