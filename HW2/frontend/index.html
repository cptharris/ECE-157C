<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Dataset Agent</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: #0a0a0a;
            color: #e8e8e8;
        }

        /* Sidebar */
        #sidebar {
            width: 220px;
            border-right: 1px solid #ddd;
            padding: 10px;
        }

        #datasetSelect {
            width: 100%;
            padding: 6px;
        }

        /* Main chat */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #111111;
        }

        .msg {
            margin-bottom: 0;
            padding: 10px 14px;
            border-radius: 6px;
            background: #1a1a1a;
            color: #e8e8e8;
            border: 1px solid #2a2a2a;
        }

        .user {
            background: #0088ff;
            color: white;
        }

        .assistant {
            background: #1a1a1a;
            color: #e8e8e8;
        }

        .answer {
            margin-top: 5px;
            white-space: pre-wrap;
        }

        /* Input bar */
        #inputBar {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #questionInput {
            flex: 1;
            padding: 10px;
        }

        button {
            margin-left: 10px;
            padding: 10px;
        }

        /* Visualization */
        #viz {
            margin-top: 10px;
        }

        /* Debug */
        .debug {
            font-size: 12px;
            background: #111;
            color: #0f0;
            padding: 10px;
            display: none;
            white-space: pre-wrap;
            margin-top: 10px;
        }

        .toggleDebug {
            font-size: 12px;
            margin-top: 5px;
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            min-width: 30px;
            min-height: 30px;
            box-sizing: border-box;
            border-width: 3px;
            border-style: solid;
            border-color: #3a3a3a;
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h4>Datasets</h4>
        <select id="datasetSelect"></select>
    </div>

    <!-- Main -->
    <div id="main">

        <div id="chat"></div>

        <div id="inputBar">
            <input id="questionInput" placeholder="Ask a question..." />
            <button onclick="sendQuestion()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        let sessionId = crypto.randomUUID();

        // Helper function to decode Plotly binary arrays
        function decodePlotlyArrays(obj) {
            // Detect Plotly binary ndarray encoding
            if (
                obj &&
                typeof obj === "object" &&
                obj.dtype &&
                obj.bdata
            ) {
                const binary = atob(obj.bdata);
                let arr;

                // Float64
                if (obj.dtype === "f8") {
                    const buf = new ArrayBuffer(binary.length);
                    const view = new Uint8Array(buf);
                    for (let i = 0; i < binary.length; i++) {
                        view[i] = binary.charCodeAt(i);
                    }
                    arr = Array.from(new Float64Array(buf));
                }
                // Int64 / fallback numeric
                else {
                    const buf = new ArrayBuffer(binary.length);
                    const view = new Uint8Array(buf);
                    for (let i = 0; i < binary.length; i++) {
                        view[i] = binary.charCodeAt(i);
                    }
                    arr = Array.from(new Float64Array(buf));
                }

                // Rebuild multidimensional shape
                if (obj.shape) {
                    const shape = obj.shape.split(',').map(n => parseInt(n.trim()));
                    if (shape.length > 1) {
                        return reshapeArray(arr, shape);
                    }
                }

                return arr;
            }

            // Recurse arrays
            if (Array.isArray(obj)) {
                return obj.map(decodePlotlyArrays);
            }

            // Recurse objects
            if (obj && typeof obj === "object") {
                const decoded = {};
                for (const key in obj) {
                    decoded[key] = decodePlotlyArrays(obj[key]);
                }
                return decoded;
            }

            return obj;
        }

        function reshapeArray(flat, shape) {
            if (shape.length === 1) return flat;

            const size = shape.slice(1).reduce((a, b) => a * b, 1);
            const result = [];

            for (let i = 0; i < flat.length; i += size) {
                result.push(
                    reshapeArray(flat.slice(i, i + size), shape.slice(1))
                );
            }

            return result;
        }

        /* -------------------------
           Load datasets
        --------------------------*/
        async function loadDatasets() {
            const res = await fetch(`${API_URL}/datasets`);
            const datasets = await res.json();

            const select = document.getElementById("datasetSelect");
            select.innerHTML = "";

            datasets.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.textContent = d;
                select.appendChild(opt);
            });
        }

        /* -------------------------
           Send question
        --------------------------*/
        async function sendQuestion() {
            const input = document.getElementById("questionInput");
            const question = input.value;
            const dataset = document.getElementById("datasetSelect").value;

            if (!question) return;

            appendMessage("user", question);

            input.value = "";
            setLoading(true);

            try {
                const res = await fetch(`${API_URL}/query`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: sessionId,
                        question: question,
                        dataset_name: dataset
                    })
                });

                const data = await res.json();
                renderResponse(data);

            } catch (err) {
                setLoading(false);
                appendMessage("assistant", "Error: " + err.message);
            }

            setLoading(false);
        }

        /* -------------------------
           Render response
        --------------------------*/
        function renderResponse(data) {
            const container = document.createElement("div");
            container.className = "msg assistant";

            // Answer
            const answer = document.createElement("div");
            answer.className = "answer";
            answer.textContent = data.final_answer;
            container.appendChild(answer);

            // Visualization
            if (data.visualization?.should_visualize) {
                const vizDiv = document.createElement("div");
                vizDiv.id = "viz_" + Math.random().toString(36).substring(7);
                container.appendChild(document.createElement("br"));
                container.appendChild(vizDiv);

                setTimeout(() => {
                    try {
                        if (data.visualization.figure_svg) {
                            const img = document.createElement("img");
                            img.src = "data:image/svg+xml;base64," + data.visualization.figure_svg;
                            img.style.width = "100%";
                            img.style.height = "auto";
                            img.style.display = "block";
                            img.style.borderRadius = "8px";
                            vizDiv.appendChild(img);
                        } else if (data.visualization.figure_png) {
                            const img = document.createElement("img");
                            img.src = "data:image/png;base64," + data.visualization.figure_png;
                            img.style.width = "100%";
                            img.style.height = "auto";
                            img.style.display = "block";
                            img.style.borderRadius = "8px";
                            vizDiv.appendChild(img);
                        } else if (data.visualization.figure_json) {
                            const fig = decodePlotlyArrays(data.visualization.figure_json);
                            Plotly.newPlot(vizDiv, fig.data, fig.layout, { responsive: true });
                        }
                    } catch (e) {
                        console.error("Plotly render error:", e);
                    }
                }, 100);
            }

            // Debug toggle
            const debugToggle = document.createElement("div");
            debugToggle.className = "toggleDebug";
            debugToggle.textContent = "Show debug";
            container.appendChild(debugToggle);

            const debugBox = document.createElement("pre");
            debugBox.className = "debug";
            debugBox.textContent = JSON.stringify(data.artifact, null, 2);
            debugBox.style.display = "none";
            container.appendChild(debugBox);

            debugToggle.onclick = () => {
                debugBox.style.display =
                    debugBox.style.display === "none" ? "block" : "none";
            };

            document.getElementById("chat").appendChild(container);
            document.getElementById("chat").scrollTop = 999999;

            if (data.artifact.execution?.error) {
                appendMessage("assistant", data.artifact.execution.error);
            }
        }

        /* -------------------------
           UI helpers
        --------------------------*/
        function scrollToBottom() {
            const area = document.getElementById('chat');
            setTimeout(() => area.scrollTop = area.scrollHeight, 50);
        }

        function appendMessage(role, text) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            div.textContent = text;
            document.getElementById("chat").appendChild(div);
            scrollToBottom();
        }

        function setLoading(isLoading) {
            const chat = document.getElementById("chat");

            if (isLoading) {
                if (document.getElementById("loadingSpinner")) return;

                const div = document.createElement("div");
                div.className = "msg assistant";
                div.id = "loadingSpinner"
                const span = document.createElement("span")
                span.className = "spinner";
                div.appendChild(span);
                chat.appendChild(div);
            } else {
                const el = document.getElementById("loadingSpinner");
                if (el) el.remove();
            }

            scrollToBottom();
        }

        document.getElementById("questionInput").addEventListener("keydown", function (event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendQuestion();
            }
        });

        /* -------------------------
           Init
        --------------------------*/
        loadDatasets();
    </script>

</body>

</html>
