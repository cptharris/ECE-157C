<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Dataset Agent</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        #sidebar {
            width: 220px;
            border-right: 1px solid #ddd;
            padding: 10px;
        }

        #datasetSelect {
            width: 100%;
            padding: 6px;
        }

        /* Main chat */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .msg {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #f5f5f5;
        }

        .user {
            background: #dff0ff;
        }

        .assistant {
            background: #f3f3f3;
        }

        .answer {
            margin-top: 5px;
            white-space: pre-wrap;
        }

        /* Input bar */
        #inputBar {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #questionInput {
            flex: 1;
            padding: 10px;
        }

        button {
            margin-left: 10px;
            padding: 10px;
        }

        /* Visualization */
        #viz {
            margin-top: 10px;
        }

        /* Debug */
        .debug {
            font-size: 12px;
            background: #111;
            color: #0f0;
            padding: 10px;
            display: none;
            white-space: pre-wrap;
            margin-top: 10px;
        }

        .toggleDebug {
            font-size: 12px;
            margin-top: 5px;
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }

        #loading {
            display: none;
            padding: 10px;
            color: gray;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h4>Datasets</h4>
        <select id="datasetSelect"></select>
    </div>

    <!-- Main -->
    <div id="main">

        <div id="chat"></div>

        <div id="loading">Processing...</div>

        <div id="inputBar">
            <input id="questionInput" placeholder="Ask a question..." />
            <button onclick="sendQuestion()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        let sessionId = crypto.randomUUID();

        /* -------------------------
           Load datasets
        --------------------------*/
        async function loadDatasets() {
            const res = await fetch(`${API_URL}/datasets`);
            const datasets = await res.json();

            const select = document.getElementById("datasetSelect");
            select.innerHTML = "";

            datasets.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.textContent = d;
                select.appendChild(opt);
            });
        }

        /* -------------------------
           Send question
        --------------------------*/
        async function sendQuestion() {
            const input = document.getElementById("questionInput");
            const question = input.value;
            const dataset = document.getElementById("datasetSelect").value;

            if (!question) return;

            appendMessage("user", question);

            input.value = "";
            setLoading(true);

            try {
                const res = await fetch(`${API_URL}/query`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: sessionId,
                        question: question,
                        dataset_name: dataset
                    })
                });

                const data = await res.json();
                renderResponse(data);

            } catch (err) {
                appendMessage("assistant", "Error: " + err.message);
            }

            setLoading(false);
        }

        /* -------------------------
           Render response
        --------------------------*/
        function renderResponse(data) {
            const container = document.createElement("div");
            container.className = "msg assistant";

            // Answer
            const answer = document.createElement("div");
            answer.className = "answer";
            answer.textContent = data.final_answer;
            container.appendChild(answer);

            // Visualization
            if (data.visualization?.should_visualize) {
                const vizDiv = document.createElement("div");
                vizDiv.id = "viz_" + Math.random().toString(36).substring(7);
                container.appendChild(vizDiv);

                setTimeout(() => {
                    try {
                        eval(data.visualization.plotly_code);
                    } catch (e) {
                        console.error("Plotly error:", e);
                    }
                }, 100);
            }

            // Debug toggle
            const debugToggle = document.createElement("div");
            debugToggle.className = "toggleDebug";
            debugToggle.textContent = "Show debug";
            container.appendChild(debugToggle);

            const debugBox = document.createElement("pre");
            debugBox.className = "debug";
            debugBox.textContent = JSON.stringify(data.artifact, null, 2);
            container.appendChild(debugBox);

            debugToggle.onclick = () => {
                debugBox.style.display =
                    debugBox.style.display === "none" ? "block" : "none";
            };

            document.getElementById("chat").appendChild(container);
            document.getElementById("chat").scrollTop = 999999;
        }

        /* -------------------------
           UI helpers
        --------------------------*/
        function appendMessage(role, text) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            div.textContent = text;
            document.getElementById("chat").appendChild(div);
        }

        function setLoading(state) {
            document.getElementById("loading").style.display =
                state ? "block" : "none";
        }

        /* -------------------------
           Init
        --------------------------*/
        loadDatasets();
    </script>

</body>

</html>
