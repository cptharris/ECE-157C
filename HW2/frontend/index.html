<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Dataset Agent</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: #0a0a0a;
            color: #e8e8e8;
        }

        /* Sidebar */
        #sidebar {
            width: 220px;
            border-right: 1px solid #ddd;
            padding: 10px;
        }

        #datasetSelect {
            width: 100%;
            padding: 6px;
        }

        /* Main chat */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #111111;
        }

        .msg {
            margin-bottom: 0;
            padding: 10px 14px;
            border-radius: 6px;
            background: #1a1a1a;
            color: #e8e8e8;
            border: 1px solid #2a2a2a;
        }

        .user {
            background: #0088ff;
            color: white;
        }

        .assistant {
            background: #1a1a1a;
            color: #e8e8e8;
        }

        .answer {
            margin-top: 5px;
            white-space: pre-wrap;
        }

        /* Input bar */
        #inputBar {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #questionInput {
            flex: 1;
            padding: 10px;
        }

        button {
            margin-left: 10px;
            padding: 10px;
        }

        /* Visualization */
        #viz {
            margin-top: 10px;
        }

        /* Debug */
        .debug {
            font-size: 12px;
            background: #111;
            color: #0f0;
            padding: 10px;
            display: none;
            white-space: pre-wrap;
            margin-top: 10px;
        }

        .toggleDebug {
            font-size: 12px;
            margin-top: 5px;
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            min-width: 30px;
            min-height: 30px;
            box-sizing: border-box;
            border-width: 3px;
            border-style: solid;
            border-color: #3a3a3a;
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h4>Datasets</h4>
        <select id="datasetSelect"></select>
    </div>

    <!-- Main -->
    <div id="main">

        <div id="chat"></div>

        <div id="inputBar">
            <input id="questionInput" placeholder="Ask a question..." />
            <button onclick="sendQuestion()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        let sessionId = crypto.randomUUID();

        // Helper function to decode Plotly binary arrays
        function decodeTypedArray(obj) {
            if (!obj || typeof obj !== "object") return obj;

            // Plotly binary array format: {dtype: "f8", bdata: "..."}
            if (obj.dtype && obj.bdata) {
                const binary = atob(obj.bdata);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }

                let view;
                switch (obj.dtype) {
                    case "f8":
                        view = new Float64Array(bytes.buffer);
                        break;
                    case "f4":
                        view = new Float32Array(bytes.buffer);
                        break;
                    case "i4":
                        view = new Int32Array(bytes.buffer);
                        break;
                    case "u4":
                        view = new Uint32Array(bytes.buffer);
                        break;
                    case "i2":
                        view = new Int16Array(bytes.buffer);
                        break;
                    case "u2":
                        view = new Uint16Array(bytes.buffer);
                        break;
                    case "i1":
                        view = new Int8Array(bytes.buffer);
                        break;
                    case "u1":
                        view = new Uint8Array(bytes.buffer);
                        break;
                    default:
                        return obj;
                }

                return Array.from(view);
            }

            if (Array.isArray(obj)) {
                return obj.map(decodeTypedArray);
            }

            const decoded = {};
            for (const key in obj) {
                decoded[key] = decodeTypedArray(obj[key]);
            }
            return decoded;
        }

        /* -------------------------
           Load datasets
        --------------------------*/
        async function loadDatasets() {
            const res = await fetch(`${API_URL}/datasets`);
            const datasets = await res.json();

            const select = document.getElementById("datasetSelect");
            select.innerHTML = "";

            datasets.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.textContent = d;
                select.appendChild(opt);
            });
        }

        /* -------------------------
           Send question
        --------------------------*/
        async function sendQuestion() {
            const input = document.getElementById("questionInput");
            const question = input.value;
            const dataset = document.getElementById("datasetSelect").value;

            if (!question) return;

            appendMessage("user", question);

            input.value = "";
            setLoading(true);

            try {
                const res = await fetch(`${API_URL}/query`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: sessionId,
                        question: question,
                        dataset_name: dataset
                    })
                });

                const data = await res.json();
                renderResponse(data);

            } catch (err) {
                setLoading(false);
                appendMessage("assistant", "Error: " + err.message);
            }

            setLoading(false);
        }

        /* -------------------------
           Render response
        --------------------------*/
        function renderResponse(data) {
            const container = document.createElement("div");
            container.className = "msg assistant";

            // Answer
            const answer = document.createElement("div");
            answer.className = "answer";
            answer.textContent = data.final_answer;
            container.appendChild(answer);

            // Visualization
            if (data.visualization?.should_visualize) {
                const vizDiv = document.createElement("div");
                vizDiv.id = "viz_" + Math.random().toString(36).substring(7);
                container.appendChild(vizDiv);

                setTimeout(() => {
                    try {
                        // Prefer server-rendered figure_json if available
                        if (data.visualization.figure_json) {
                            const fig = decodeTypedArray(data.visualization.figure_json);
                            console.log(fig.data);
                            Plotly.newPlot(vizDiv, fig.data, fig.layout, { responsive: true });
                        } else if (data.visualization.plotly_code) {
                            // fallback: execute generated code
                            eval(data.visualization.plotly_code);
                            if (typeof fig !== "undefined") {
                                Plotly.newPlot(vizDiv, fig.data, fig.layout);
                            }
                        }
                    } catch (e) {
                        console.error("Plotly render error:", e);
                    }
                }, 100);
            }

            // Debug toggle
            const debugToggle = document.createElement("div");
            debugToggle.className = "toggleDebug";
            debugToggle.textContent = "Show debug";
            container.appendChild(debugToggle);

            const debugBox = document.createElement("pre");
            debugBox.className = "debug";
            debugBox.textContent = JSON.stringify(data.artifact, null, 2);
            container.appendChild(debugBox);

            debugToggle.onclick = () => {
                debugBox.style.display =
                    debugBox.style.display === "none" ? "block" : "none";
            };

            document.getElementById("chat").appendChild(container);
            document.getElementById("chat").scrollTop = 999999;
        }

        /* -------------------------
           UI helpers
        --------------------------*/
        function scrollToBottom() {
            const area = document.getElementById('chat');
            setTimeout(() => area.scrollTop = area.scrollHeight, 50);
        }

        function appendMessage(role, text) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            div.textContent = text;
            document.getElementById("chat").appendChild(div);
            scrollToBottom();
        }

        function setLoading(isLoading) {
            const chat = document.getElementById("chat");

            if (isLoading) {
                if (document.getElementById("loadingSpinner")) return;

                const div = document.createElement("div");
                div.className = "msg assistant";
                div.id = "loadingSpinner"
                const span = document.createElement("span")
                span.className = "spinner";
                div.appendChild(span);
                chat.appendChild(div);
            } else {
                const el = document.getElementById("loadingSpinner");
                if (el) el.remove();
            }

            scrollToBottom();
        }

        document.getElementById("questionInput").addEventListener("keydown", function (event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendQuestion();
            }
        });

        /* -------------------------
           Init
        --------------------------*/
        loadDatasets();
    </script>

</body>

</html>
