<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590">
  <rect width="680" height="590" fill="white"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- history -->
  <rect x="260" y="20" width="160" height="40" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#374151">history</text>

  <line x1="340" y1="60" x2="340" y2="78" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- describe_dataset -->
  <rect x="255" y="80" width="170" height="40" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="340" y="100" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#374151">describe_dataset</text>

  <line x1="340" y1="120" x2="340" y2="138" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- planner (LLM) -->
  <rect x="260" y="140" width="160" height="40" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#1E40AF">planner</text>

  <line x1="340" y1="180" x2="340" y2="198" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- codegen (LLM) -->
  <rect x="260" y="200" width="160" height="40" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#1E40AF">codegen</text>

  <line x1="340" y1="240" x2="340" y2="258" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- execute -->
  <rect x="260" y="260" width="160" height="40" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#92400E">execute</text>

  <!-- execute → stop (error) -->
  <line x1="420" y1="280" x2="468" y2="280" stroke="#EF4444" stroke-width="1.5" marker-end="url(#ah-red)"/>
  <text x="444" y="271" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EF4444">error</text>
  <rect x="470" y="266" width="72" height="28" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
  <text x="506" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#DC2626">stop</text>

  <!-- Branch from execute: vertical stem then fork -->
  <line x1="340" y1="300" x2="340" y2="330" stroke="#9CA3AF" stroke-width="1.5"/>
  <!-- left branch → respond -->
  <path d="M 340 330 L 130 330 L 130 348" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="230" y="322" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280">do_response</text>
  <!-- right branch → visualize_codegen -->
  <path d="M 340 330 L 500 330 L 500 348" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="424" y="322" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280">vis only</text>

  <!-- respond (LLM) -->
  <rect x="50" y="350" width="160" height="40" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="130" y="370" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#1E40AF">respond</text>

  <!-- respond → visualize_codegen (do_vis) -->
  <line x1="210" y1="370" x2="398" y2="370" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="304" y="362" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280">do_vis</text>

  <!-- respond → END -->
  <line x1="130" y1="390" x2="130" y2="448" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- END (respond path) -->
  <rect x="90" y="450" width="80" height="28" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="130" y="464" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#374151">END</text>

  <!-- visualize_codegen (LLM) -->
  <rect x="400" y="350" width="200" height="40" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="500" y="370" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#1E40AF">visualize_codegen</text>

  <line x1="500" y1="390" x2="500" y2="418" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- visualize_execute -->
  <rect x="400" y="420" width="200" height="40" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="500" y="440" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#92400E">visualize_execute</text>

  <line x1="500" y1="460" x2="500" y2="488" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- END (vis path) -->
  <rect x="460" y="490" width="80" height="28" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="500" y="504" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#374151">END</text>

  <!-- Legend -->
  <rect x="40" y="538" width="600" height="36" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="55" y="549" width="14" height="14" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="75" y="556" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#374151">LLM call</text>
  <rect x="150" y="549" width="14" height="14" rx="3" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="170" y="556" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#374151">deterministic</text>
  <rect x="270" y="549" width="14" height="14" rx="3" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="290" y="556" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#374151">code execution</text>
  <rect x="410" y="549" width="14" height="14" rx="3" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
  <text x="430" y="556" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#374151">error / stop</text>
  <rect x="520" y="549" width="14" height="14" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="540" y="556" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#374151">terminal</text>
</svg>
